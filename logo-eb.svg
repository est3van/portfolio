<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#1e3a6e"/>
    </linearGradient>
  </defs>

  <!-- Fond circulaire -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>

  <!-- Anneau fin type "circuit" -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#4f7fd1" stroke-width="1.5" opacity="0.5"/>

  <!-- Petits points type circuit imprimé -->
  <circle cx="100" cy="12" r="3" fill="#4f7fd1"/>
  <circle cx="100" cy="188" r="3" fill="#4f7fd1"/>
  <circle cx="12" cy="100" r="3" fill="#4f7fd1"/>
  <circle cx="188" cy="100" r="3" fill="#4f7fd1"/>

  <!-- Monogramme EB -->
  <text x="100" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="88" font-weight="700"
        text-anchor="middle" fill="#ffffff" letter-spacing="-4">EB</text>

  <!-- Petite ligne soulignant, style tech -->
  <rect x="62" y="140" width="76" height="4" rx="2" fill="#4f7fd1"/>
</svg>
